name: Build index.html

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.js'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: node build.js

      - name: Commit built index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: rebuild index.html from src"
          git push
